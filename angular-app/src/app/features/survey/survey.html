<div class="min-h-screen bg-white py-12 px-6 md:px-20 font-sans">
  <form
    [formGroup]="surveyForm"
    (ngSubmit)="onSubmit()"
    class="max-w-5xl mx-auto space-y-6 text-[13px]"
  >
    <div class="text-center mb-10 border-b border-gray-300 pb-6">
      <h1 class="text-2xl font-bold text-[#2b5a9a]">
        {{ t.title }}
      </h1>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-4">
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">{{ t.name }}</label>
        <input
          type="text"
          formControlName="name"
          [placeholder]="t.namePlaceholder"
          class="w-full border border-gray-300 p-1.5 rounded outline-none transition-all focus:border-blue-600 focus:ring-1 focus:ring-blue-600 shadow-sm"
        />
      </div>
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">{{ t.id }}</label>
        <input
          type="text"
          formControlName="nationalId"
          class="w-full border border-gray-300 p-1.5 rounded outline-none transition-all focus:border-blue-600 focus:ring-1 focus:ring-blue-600 shadow-sm"
        />
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-4">
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">{{ t.mobile }}</label>
        <div class="flex group">
          <span
            class="bg-gray-100 border border-r-0 border-gray-300 px-3 py-1.5 text-gray-500 text-xs flex items-center"
            >+966</span
          >
          <input
            type="text"
            formControlName="mobile"
            placeholder="500000000"
            class="w-full border border-gray-300 p-1.5 rounded-r outline-none transition-all focus:border-blue-600 focus:ring-1 focus:ring-blue-600 shadow-sm"
          />
        </div>
      </div>
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">{{ t.email }}</label>
        <input
          type="email"
          formControlName="email"
          placeholder="example@mail.com"
          class="w-full border border-gray-300 p-1.5 rounded outline-none transition-all focus:border-blue-600 focus:ring-1 focus:ring-blue-600 shadow-sm"
        />
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-4">
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">{{ t.gender }}</label>
        <div class="flex gap-6 py-1.5">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" formControlName="gender" value="Male" class="accent-blue-600" />{{
              t.male
            }}
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" formControlName="gender" value="Female" class="accent-blue-600" />{{
              t.female
            }}
          </label>
        </div>
      </div>
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">{{ t.nationality }}</label>
        <input
          type="text"
          formControlName="nationality"
          class="w-full border border-gray-300 p-1.5 rounded outline-none transition-all focus:border-blue-600 focus:ring-1 focus:ring-blue-600 shadow-sm"
        />
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-4">
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700 text-[13px]">{{ t.qualification }}</label>
        <div class="relative">
          <select
            formControlName="qualification"
            class="w-full border border-gray-300 p-2 rounded text-[13px] text-gray-700 outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 appearance-none bg-white cursor-pointer shadow-sm"
          >
            <option value="" disabled selected>{{ t.selectQualification }}</option>
            <option value="elementary">Elementary level</option>
            <option value="highschool">High school level</option>
            <option value="diploma">Diploma</option>
            <option value="bachelor">Bachelor degree</option>
            <option value="master">Master degree</option>
            <option value="phd">PHD</option>
          </select>
          <div
            class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none text-gray-400"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              ></path>
            </svg>
          </div>
        </div>
      </div>
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700 text-[13px]">{{ t.major }}</label>
        <input
          type="text"
          formControlName="major"
          [placeholder]="t.majorPlaceholder"
          class="w-full border border-gray-300 p-2 rounded text-[13px] outline-none transition-all focus:border-blue-600 focus:ring-1 focus:ring-blue-600 shadow-sm"
        />
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-4">
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">{{ t.currentPosition }}</label>
        <input
          type="text"
          formControlName="currentPosition"
          class="w-full border border-gray-300 p-1.5 rounded outline-none transition-all focus:border-blue-600 focus:ring-1 focus:ring-blue-600 shadow-sm"
        />
      </div>
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">{{ t.experienceYears }}</label>
        <input
          type="text"
          formControlName="experienceYears"
          class="w-full border border-gray-300 p-1.5 rounded outline-none transition-all focus:border-blue-600 focus:ring-1 focus:ring-blue-600 shadow-sm"
        />
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-4">
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">{{ t.favoriteCity }}</label>
        <select
          formControlName="favoriteCity"
          class="w-full border border-gray-300 p-1.5 rounded outline-none bg-white transition-all focus:border-blue-600 focus:ring-1 focus:ring-blue-600 cursor-pointer shadow-sm"
        >
          <option value=""></option>
          <option value="Dammam">Dammam</option>
          <option value="Riyadh">Riyadh</option>
          <option value="Jeddah">Jeddah</option>
        </select>
      </div>
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">{{ t.experienceLevel }}</label>
        <div class="flex gap-6 py-1.5">
          <label class="flex items-center gap-2 cursor-pointer">
            <input
              type="radio"
              formControlName="experienceLevel"
              value="Beginner"
              class="accent-blue-600"
            />
            Beginner
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input
              type="radio"
              formControlName="experienceLevel"
              value="Intermediate"
              class="accent-blue-600"
            />
            Intermediate
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input
              type="radio"
              formControlName="experienceLevel"
              value="Expert"
              class="accent-blue-600"
            />
            Expert
          </label>
        </div>
      </div>
    </div>

    <div class="space-y-2">
      <label class="block font-semibold text-[#2b5a9a] border-b border-gray-200">{{
        t.rolesTitle
      }}</label>
      <p class="text-xs text-gray-600 mb-2">{{ t.rolesSub }}</p>

      <div
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-y-3 bg-gray-50 p-4 border border-gray-200 rounded"
      >
        @for (role of jobRoles; track role.key) {
        <label class="flex items-center gap-2 cursor-pointer hover:text-blue-700 transition-colors">
          <input
            type="checkbox"
            (change)="onRoleChange(role.key, $event)"
            class="w-4 h-4 accent-blue-600 cursor-pointer"
          />
          <span class="text-[13px]">{{ isArabic ? role.ar : role.en }}</span>
        </label>
        } @if (surveyForm.get('selectedRoles')?.value?.includes('Others')) {
        <div class="col-span-full mt-2 animate-fade-in">
          <input
            type="text"
            formControlName="otherRoleRemarks"
            placeholder="Please specify (e.g. Truck driver, farmer...)"
            class="w-full border border-gray-300 p-2 rounded outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 bg-white shadow-inner"
          />
        </div>
        }
      </div>
    </div>

    <div
      class="border border-blue-200 rounded mt-8 overflow-hidden focus-within:ring-1 focus-within:ring-blue-600 focus-within:border-blue-600"
    >
      <div class="bg-blue-50 px-4 py-2 border-b border-blue-200">
        <h3 class="font-bold text-[#2b5a9a]">Remarks:</h3>
      </div>
      <textarea
        formControlName="remarks"
        class="w-full p-2 h-24 outline-none resize-none transition-all"
      ></textarea>
    </div>

    <div class="flex items-end justify-between pt-4">
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">Upload resume (PDF only)</label>
        <div class="border border-gray-300 p-1 rounded w-64 md:w-80 flex items-center bg-white">
          <input
            type="file"
            accept=".pdf"
            (change)="onFileSelected($event)"
            class="text-[10px] text-gray-500 outline-none"
          />
        </div>
      </div>
      <button
        type="submit"
        [disabled]="surveyForm.invalid"
        class="bg-[#1e4e8c] disabled:bg-gray-400 text-white px-8 py-2 rounded font-bold hover:bg-blue-900 transition shadow-md active:scale-95"
      >
        {{ t.submit }}
      </button>
    </div>
  </form>
</div>
