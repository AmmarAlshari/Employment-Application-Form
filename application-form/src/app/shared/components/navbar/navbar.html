<nav
  [class.-translate-y-full]="isHidden"
  class="bg-white/80 backdrop-blur-md border-b border-gray-100 py-5 px-6 md:px-20 flex justify-between items-center sticky top-0 z-50 transition-transform duration-500 ease-in-out"
>
  <button
    type="button"
    [routerLink]="checkAr() ? 'Index' : 'IndexAr'"
    class="relative overflow-hidden px-4 py-1.5 rounded-full border border-gray-200 text-[12px] font-semibold text-blue-900 hover:bg-blue-50 hover:border-blue-200 transition-all active:scale-95"
  >
    <span class="flex items-center gap-2">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-3.5 h-3.5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 002 2h1.5a2.5 2.5 0 012.5 2.5V17m-6 5c4.418 0 8-3.582 8-8a8 8 0 00-8-8 8 8 0 00-8 8c0 4.418 3.582 8 8 8z"
        />
      </svg>
      {{ checkAr() ? 'English' : 'عربي' }}
    </span>
  </button>

  <div class="flex items-center">
    <a
      routerLink="Index"
      class="cursor-pointer transition-transform hover:scale-105 active:scale-95"
    >
      <img
        src="almajdouie-logo.png"
        alt="Almajdouie Logo"
        class="h-8 md:h-12 w-auto object-contain"
      />
    </a>
  </div>
</nav>
