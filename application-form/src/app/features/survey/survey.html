<div
  [attr.dir]="isArabic ? 'rtl' : 'ltr'"
  class="min-h-screen bg-white py-12 px-6 md:px-20 font-sans"
>
  <form
    [formGroup]="surveyForm"
    (ngSubmit)="onSubmit()"
    class="max-w-5xl mx-auto space-y-6 text-[13px]"
  >
    <div class="text-center mb-10 border-b border-gray-300 pb-6">
      <h1 class="text-2xl font-bold text-[#2b5a9a]">{{ t.title }}</h1>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-4">
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">{{ t.name }}</label>
        <input
          type="text"
          formControlName="name"
          [placeholder]="t.namePlaceholder"
          class="w-full border border-gray-300 p-1.5 rounded outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 shadow-sm"
        />
      </div>
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">{{ t.id }}</label>
        <input
          type="text"
          formControlName="nationalId"
          class="w-full border border-gray-300 p-1.5 rounded outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 shadow-sm"
        />
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-4">
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">{{ t.mobile }}</label>
        <div class="flex group">
          <span
            class="bg-gray-100 border border-r-0 border-gray-300 px-3 py-1.5 text-gray-500 text-xs flex items-center"
            >+966</span
          >
          <input
            type="text"
            formControlName="mobile"
            placeholder="500000000"
            class="w-full border border-gray-300 p-1.5 rounded-r outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 shadow-sm"
          />
        </div>
      </div>
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">{{ t.email }}</label>
        <input
          type="email"
          formControlName="email"
          placeholder="example@mail.com"
          class="w-full border border-gray-300 p-1.5 rounded outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 shadow-sm"
        />
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-4">
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">{{ t.gender }}</label>
        <div class="flex gap-6 py-1.5">
          <label class="flex items-center gap-2 cursor-pointer"
            ><input type="radio" formControlName="gender" value="Male" class="accent-blue-600" />{{
              t.male
            }}</label
          >
          <label class="flex items-center gap-2 cursor-pointer"
            ><input
              type="radio"
              formControlName="gender"
              value="Female"
              class="accent-blue-600"
            />{{ t.female }}</label
          >
        </div>
      </div>
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">{{ t.nationality }}</label>
        <select
          formControlName="nationalityId"
          class="w-full border border-gray-300 p-1.5 rounded outline-none bg-white focus:border-blue-600 focus:ring-1 focus:ring-blue-600 shadow-sm"
        >
          <option *ngFor="let n of nationalities()" [ngValue]="n.id">
            {{ isArabic ? n.countryNameAr : n.countryName }}
          </option>
        </select>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-4">
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">{{ t.selectQualification }}</label>
        <select
          formControlName="qualificationId"
          class="w-full border border-gray-300 p-1.5 rounded outline-none bg-white focus:border-blue-600 focus:ring-1 focus:ring-blue-600 shadow-sm"
        >
          <option *ngFor="let q of qualifications()" [ngValue]="q.id">
            {{ isArabic ? q.qualificationNameAr : q.qualificationName }}
          </option>
        </select>
      </div>
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">{{ t.freshGraduate }}</label>
        <div class="flex gap-6 py-1.5">
          <label class="flex items-center gap-2 cursor-pointer"
            ><input
              type="radio"
              formControlName="isFreshGraduate"
              [value]="true"
              class="accent-blue-600"
            />{{ t.yes }}</label
          >
          <label class="flex items-center gap-2 cursor-pointer"
            ><input
              type="radio"
              formControlName="isFreshGraduate"
              [value]="false"
              class="accent-blue-600"
            />{{ t.no }}</label
          >
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-4">
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">{{ t.major }}</label>
        <input
          type="text"
          formControlName="major"
          [placeholder]="t.majorPlaceholder"
          class="w-full border border-gray-300 p-2 rounded outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 shadow-sm"
        />
      </div>
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">{{ t.currentPosition }}</label>
        <input
          type="text"
          formControlName="currentPosition"
          class="w-full border border-gray-300 p-1.5 rounded outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 shadow-sm"
        />
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-4">
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">{{ t.experienceYears }}</label>
        <input
          type="text"
          formControlName="experienceYears"
          class="w-full border border-gray-300 p-1.5 rounded outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 shadow-sm"
        />
      </div>
      <div class="space-y-1">
        <label class="block font-semibold text-gray-700">{{ t.favoriteCity }}</label>
        <select
          formControlName="favoriteCityId"
          class="w-full border border-gray-300 p-1.5 rounded outline-none bg-white focus:border-blue-600 focus:ring-1 focus:ring-blue-600 shadow-sm"
        >
          <option *ngFor="let c of cities()" [ngValue]="c.id">
            {{ isArabic ? c.cityNameAr : c.cityName }}
          </option>
        </select>
      </div>
    </div>

    <div class="space-y-1">
      <label class="block font-semibold text-gray-700">{{ t.experienceLevel }}</label>
      <div class="flex gap-6 py-1.5">
        <label class="flex items-center gap-2 cursor-pointer"
          ><input
            type="radio"
            formControlName="experienceLevel"
            value="Beginner"
            class="accent-blue-600"
          />
          {{ t.beginner }}</label
        >
        <label class="flex items-center gap-2 cursor-pointer"
          ><input
            type="radio"
            formControlName="experienceLevel"
            value="Intermediate"
            class="accent-blue-600"
          />
          {{ t.intermediate }}</label
        >
        <label class="flex items-center gap-2 cursor-pointer"
          ><input
            type="radio"
            formControlName="experienceLevel"
            value="Expert"
            class="accent-blue-600"
          />
          {{ t.expert }}</label
        >
      </div>
    </div>

    <div class="space-y-2">
      <label class="block font-semibold text-[#2b5a9a] border-b border-gray-200">{{
        t.rolesTitle
      }}</label>
      <p class="text-xs text-gray-600 mb-2"></p>
      <div
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-y-3 bg-gray-50 p-4 border border-gray-200 rounded"
      >
        @for (role of roles(); track role.id) {
          <label
            class="flex items-center gap-2 cursor-pointer hover:text-blue-700 transition-colors"
          >
            <input
              type="checkbox"
              class="w-4 h-4 accent-blue-600 cursor-pointer"
              [checked]="isRoleSelected(role.id)"
              (change)="onRoleChange(role.id, $event)"
            />

            <span class="text-[13px]">
              {{ isArabic ? role.roleNameAr : role.roleName }}
            </span>
          </label>
        }

        <label class="flex items-center gap-2 cursor-pointer mt-3">
          <input
            type="checkbox"
            class="w-4 h-4 accent-blue-600 cursor-pointer"
            formControlName="isOtherRoleSelected"
          />
          <span class="text-[13px]">
            {{ isArabic ? 'أخرى' : 'Other' }}
          </span>
        </label>
      </div>
    </div>
    <div *ngIf="surveyForm.get('isOtherRoleSelected')?.value" class="col-span-full mt-2">
      <input
        type="text"
        formControlName="otherRoleRemarks"
        class="w-full border border-gray-300 p-2 rounded text-[13px]"
        [placeholder]="t.othersPlaceholder"
      />
    </div>

    <div class="border border-blue-200 rounded mt-8 overflow-hidden">
      <div class="bg-blue-50 px-4 py-2 border-b border-blue-200">
        <h3 class="font-bold text-[#2b5a9a]">Remarks:</h3>
      </div>
      <textarea
        formControlName="remarks"
        class="w-full p-2 h-24 outline-none resize-none"
      ></textarea>
    </div>

    <div class="flex items-end justify-between pt-4">
      <div class="max-w-sm">
        <label class="block mb-2 text-sm font-semibold text-gray-700">
          {{ t.cvLabel }}
        </label>

        <div class="relative group">
          <input
            type="file"
            (change)="onFileSelected($event)"
            id="cv-upload"
            class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
          />

          <div
            class="flex items-center justify-between px-5 py-2 border-2 border-dashed border-gray-300 rounded-xl bg-gray-50 transition-all duration-300 group-hover:border-blue-400 group-hover:bg-blue-50"
          >
            <div class="flex items-center space-x-3">
              <div class="p-2 bg-white rounded-lg shadow-sm border border-gray-100">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="w-5 h-5 text-blue-500"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
                  />
                </svg>
              </div>

              <div class="flex flex-col text-left">
                <span class="text-xs font-medium text-gray-700">Choose a file</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <button
        type="submit"
        [disabled]="surveyForm.invalid"
        class="bg-[#1e4e8c] disabled:bg-gray-400 text-white px-8 py-2 rounded font-bold hover:bg-blue-900 transition shadow-md active:scale-95 cursor-pointer"
      >
        {{ t.submit }}
      </button>
    </div>
  </form>
</div>
