<!-- Mobile Toggle Button -->
<button
  class="fixed top-10 left-4 z-50 md:hidden bg-white p-2 rounded-md shadow"
  (click)="isOpen = !isOpen"
>
  <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      d="M4 6h16M4 12h16M4 18h16"
    />
  </svg>
</button>

<div
  class="relative flex h-[calc(100vh-2rem)] w-full max-w-[20rem] flex-col rounded-xl bg-white bg-clip-border p-4 text-gray-700 shadow-xl shadow-blue-gray-900/5 transition-transform duration-300 md:translate-x-0"
  [class.-translate-x-full]="!isOpen"
>
  <nav
    class="flex min-w-[240px] flex-col gap-1 p-2 font-sans text-base font-normal text-blue-gray-700"
  >
    <!-- Dashboard -->
    <div
      role="button"
      class="flex items-center w-full p-3 rounded-lg transition-all hover:bg-blue-gray-50 hover:text-blue-600 cursor-pointer"
    >
      Dashboard
    </div>

    <!-- Users -->
    <div
      role="button"
      class="flex items-center w-full p-3 rounded-lg transition-all hover:bg-blue-gray-50 hover:text-blue-600 cursor-pointer"
    >
      Users
    </div>

    <!-- Applications -->
    <div
      role="button"
      class="flex items-center w-full p-3 rounded-lg transition-all hover:bg-blue-gray-50 hover:text-blue-600 cursor-pointer"
      onclick=
    >
      Applications
    </div>

    <hr class="my-2 border-blue-gray-50" />

    <!-- Profile -->
    <div
      role="button"
      class="flex items-center w-full p-3 rounded-lg transition-all hover:bg-blue-gray-50 hover:text-blue-600 cursor-pointer"
    >
      Profile
    </div>

    <!-- Logout -->
    <div
      role="button"
      class="flex items-center w-full p-3 rounded-lg transition-all hover:bg-red-50 hover:text-red-600 cursor-pointer"
    >
      Log Out
    </div>
  </nav>
</div>
