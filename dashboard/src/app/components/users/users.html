<div
  class="relative flex flex-col text-slate-700 bg-white shadow-md rounded-xl bg-clip-border scroll-smooth"
>
  <div
    class="relative mx-4 mt-4 overflow-hidden text-slate-700 bg-white rounded-none bg-clip-border"
  >
    <div class="flex items-center justify-between">
      <div>
        <h3 class="text-lg font-semibold text-slate-800">Dashboard users</h3>
      </div>
      <div class="flex flex-col gap-2 shrink-0 sm:flex-row">
        <!-- ADD USER -->
        <button
          *ngIf="!creatingUser()"
          class="flex items-center gap-2 rounded bg-blue-800 py-2.5 px-4 text-xs font-semibold text-white shadow-md hover:shadow-lg transition-all cursor-pointer"
          type="button"
          (click)="startCreateUser()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-4 h-4"
          >
            <path
              d="M6.25 6.375a4.125 4.125 0 118.25 0 4.125 4.125 0 01-8.25 0zM3.25 19.125a7.125 7.125 0 0114.25 0v.003l-.001.119a.75.75 0 01-.363.63 13.067 13.067 0 01-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 01-.364-.63l-.001-.122zM19.75 7.5a.75.75 0 00-1.5 0v2.25H16a.75.75 0 000 1.5h2.25v2.25a.75.75 0 001.5 0v-2.25H22a.75.75 0 000-1.5h-2.25V7.5z"
            />
          </svg>
          Add user
        </button>

        <!-- SAVE / CANCEL -->
        <div *ngIf="creatingUser()" class="flex gap-2">
          <button
            class="rounded bg-blue-800 py-2.5 px-4 text-xs font-semibold text-white shadow-md cursor-pointer"
            (click)="saveNewUser()"
          >
            Save
          </button>

          <button
            class="rounded bg-gray-200 py-2.5 px-4 text-xs font-semibold cursor-pointer"
            (click)="cancelCreateUser()"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="p-0 overflow-scroll">
    <table class="w-full mt-4 text-left table-auto min-w-max">
      <thead>
        <tr>
          <th class="p-4 border-y border-slate-200 bg-slate-50">
            <p class="text-sm font-normal leading-none text-slate-500">Email</p>
          </th>
          <th class="p-4 border-y border-slate-200 bg-slate-50">
            <p class="text-sm font-normal leading-none text-slate-500">Role</p>
          </th>
          <th class="p-4 border-y border-slate-200 bg-slate-50">
            <p class="text-sm font-normal leading-none text-slate-500">Created at</p>
          </th>
          <th class="p-4 border-y border-slate-200 bg-slate-50"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users()">
          <td class="p-4 border-b border-slate-200">
            <div class="flex items-center gap-3">
              <div class="flex flex-col">
                <p class="text-sm text-slate-500">{{ user.email }}</p>
              </div>
            </div>
          </td>
          <td class="p-4 border-b border-slate-200">
            <div class="flex">
              <p
                class="px-3 py-1 text-xs font-semibold rounded-full bg-purple-100 text-purple-800"
                [ngClass]="{
                  'bg-purple-100 text-purple-800': user.role === 'ADMIN',
                  'bg-blue-100 text-blue-800': user.role === 'HR',
                  'bg-gray-100 text-gray-800': user.role !== 'ADMIN' && user.role !== 'HR',
                }"
              >
                {{ user.role }}
              </p>
            </div>
          </td>
          <td class="p-4 border-b border-slate-200">
            <div class="w-max">
              <div
                class="px-2 py-1 text-xs font-bold text-green-900 uppercase rounded-md bg-green-500/20"
              >
                <span>{{ user.createdAt | date: 'dd/MM/yyyy' }}</span>
              </div>
            </div>
          </td>
          <td class="p-4 border-b border-slate-200 text-right">
            <button
              class="h-8 w-8 flex items-center justify-center rounded-md bg-red-100 text-red-600 hover:bg-red-200 transition"
              title="Delete user"
              (click)="deleteUser(user.id)"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-4 h-4"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path
                  d="M9 3h6a1 1 0 011 1v1h4v2H4V5h4V4a1 1 0 011-1zM6 9h12l-1 11a2 2 0 01-2 2H9a2 2 0 01-2-2L6 9z"
                />
              </svg>
            </button>
          </td>
        </tr>
        <tr *ngIf="creatingUser()">
          <!-- Email -->
          <td class="p-4 border-b border-slate-200">
            <input
              type="email"
              placeholder="Email"
              class="w-full px-3 py-2 text-sm border rounded-md"
              [(ngModel)]="newUser().email"
            />
          </td>
          <td class="p-4 border-b border-slate-200">
            <input
              type="Password"
              placeholder="Password must be 8 length"
              class="w-full px-3 py-2 text-sm border rounded-md"
              [(ngModel)]="newUser().password"
            />
          </td>

          <!-- Role -->
          <td class="p-4 border-b border-slate-200">
            <select class="w-full px-3 py-2 text-sm border rounded-md" [(ngModel)]="newUser().role">
              <option value="ADMIN">ADMIN</option>
              <option value="HR">HR</option>
            </select>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
