<div class="bg-white border border-slate-100 shadow-sm rounded-2xl overflow-hidden font-sans">
  <div class="px-6 py-5 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between border-b border-slate-50 bg-white/50 backdrop-blur-sm">
    <div>
      <h3 class="text-xl font-bold text-slate-800 tracking-tight">System Users</h3>
    </div>

    <div class="flex items-center gap-3">
      <button
        *ngIf="!creatingUser()"
        class="flex items-center gap-2 rounded-xl bg-indigo-600 py-2.5 px-5 text-xs font-bold text-white shadow-indigo-100 hover:shadow-lg hover:bg-indigo-700 active:scale-95 transition-all cursor-pointer"
        type="button"
        (click)="startCreateUser()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4">
          <path d="M6.25 6.375a4.125 4.125 0 118.25 0 4.125 4.125 0 01-8.25 0zM3.25 19.125a7.125 7.125 0 0114.25 0v.003l-.001.119a.75.75 0 01-.363.63 13.067 13.067 0 01-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 01-.364-.63l-.001-.122zM19.75 7.5a.75.75 0 00-1.5 0v2.25H16a.75.75 0 000 1.5h2.25v2.25a.75.75 0 001.5 0v-2.25H22a.75.75 0 000-1.5h-2.25V7.5z" />
        </svg>
        Add User
      </button>

      <div *ngIf="creatingUser()" class="flex items-center gap-2 animate-in fade-in slide-in-from-right-2">
        <button
          [disabled]="isSubmitting()"
          class="rounded-xl bg-emerald-600 py-2.5 px-6 text-xs font-bold text-white shadow-emerald-100 hover:bg-emerald-700 transition-all cursor-pointer disabled:opacity-50"
          (click)="saveNewUser()"
        >
          {{ isSubmitting() ? 'Saving...' : 'Save User' }}
        </button>
        <button
          class="rounded-xl bg-slate-100 py-2.5 px-5 text-xs font-bold text-slate-600 hover:bg-slate-200 transition-all cursor-pointer"
          (click)="cancelCreateUser()"
        >
          Cancel
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="errorMessage()" class="bg-red-50 border-b border-red-100 px-6 py-3 animate-in slide-in-from-top duration-300">
    <div class="flex items-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5 text-red-500">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0v-4.5A.75.75 0 0110 5zm0 10a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" />
      </svg>
      <p class="text-sm font-semibold text-red-700">{{ errorMessage() }}</p>
      <button (click)="errorMessage.set(null)" class="ml-auto text-red-400 hover:text-red-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </div>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-left table-auto min-w-[800px]">
      <thead>
        <tr class="bg-slate-50/50">
          <th class="p-4 border-b border-slate-100">
            <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">User Email</span>
          </th>
          <th class="p-4 border-b border-slate-100">
            <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Security Role</span>
          </th>
          <th class="p-4 border-b border-slate-100">
            <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Onboarding Date</span>
          </th>
          <th class="p-4 border-b border-slate-100"></th>
        </tr>
      </thead>

      <tbody class="divide-y divide-slate-50">
        <tr *ngIf="creatingUser()" class="bg-indigo-50/30">
          <td class="p-4">
            <input
              type="email"
              placeholder="Enter email address"
              class="w-full px-4 py-2.5 text-sm bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all cursor-text"
              [(ngModel)]="newUser().email"
            />
          </td>
          <td class="p-4">
            <div class="flex gap-2">
              <input
                type="password"
                placeholder="Password (6+ chars)"
                class="w-1/2 px-4 py-2.5 text-sm bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500/20 outline-none cursor-text"
                [(ngModel)]="newUser().password"
              />
              <select
                class="w-1/2 px-4 py-2.5 text-sm bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500/20 outline-none cursor-pointer"
                [(ngModel)]="newUser().role"
              >
                <option value="ADMIN">ADMIN</option>
                <option value="HR">HR</option>
              </select>
            </div>
          </td>
          <td class="p-4">
            <span class="text-xs font-medium text-slate-400">Drafting...</span>
          </td>
          <td class="p-4"></td>
        </tr>

        <tr *ngFor="let user of users()" class="hover:bg-slate-50/80 transition-colors group">
          <td class="p-4">
            <div class="flex items-center gap-3">
              <div class="h-9 w-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 font-bold text-xs uppercase group-hover:bg-indigo-100 group-hover:text-indigo-600 transition-colors">
                {{ user.email.substring(0, 2) }}
              </div>
              <p class="text-sm font-semibold text-slate-700">{{ user.email }}</p>
            </div>
          </td>
          <td class="p-4">
            <span
              class="inline-flex items-center gap-1.5 px-3 py-1 text-[11px] font-bold rounded-full transition-all"
              [ngClass]="{
                'bg-purple-50 text-purple-700 ring-1 ring-purple-200': user.role === 'ADMIN',
                'bg-blue-50 text-blue-700 ring-1 ring-blue-200': user.role === 'HR',
                'bg-slate-50 text-slate-600 ring-1 ring-slate-200': user.role !== 'ADMIN' && user.role !== 'HR'
              }"
            >
              <span class="h-1.5 w-1.5 rounded-full" [ngClass]="user.role === 'ADMIN' ? 'bg-purple-500' : 'bg-blue-500'"></span>
              {{ user.role }}
            </span>
          </td>
          <td class="p-4">
            <span class="text-sm font-medium text-slate-500">
              {{ user.createdAt | date: 'MMM dd, yyyy' }}
            </span>
          </td>
          <td class="p-4 text-right">
            <button
              class="h-9 w-9 inline-flex items-center justify-center rounded-xl bg-white border border-slate-100 text-slate-400 hover:text-red-600 hover:bg-red-50 hover:border-red-100 transition-all cursor-pointer shadow-sm"
              title="Delete user"
              (click)="deleteUser(user)"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
