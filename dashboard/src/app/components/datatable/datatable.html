<div class="bg-white border border-slate-100 shadow-sm rounded-2xl overflow-hidden font-sans">
  <div
    class="px-6 py-5 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between border-b border-slate-50 bg-white/50 backdrop-blur-sm"
  >
    <div>
      <h3 class="text-xl font-bold text-slate-800 tracking-tight">
        {{ title }}
      </h3>
      <p class="text-sm text-slate-500 font-medium">
        Manage and view {{ title | lowercase }} details
      </p>
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <div class="relative">
        <input
          type="text"
          [placeholder]="searchTitle"
          (input)="searchTerm.set($any($event.target).value)"
          class="w-full sm:w-64 pl-4 pr-4 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all cursor-text"
        />
      </div>

      <button
        class="flex items-center gap-2 rounded-xl bg-indigo-600 py-2.5 px-5 text-xs font-bold text-white shadow-indigo-100 hover:shadow-lg hover:bg-indigo-700 active:scale-95 transition-all cursor-pointer whitespace-nowrap"
        type="button"
        (click)="startCreate()"
        *ngIf="auth.role() === 'ADMIN'"
      >
        {{ buttonTitle }}
      </button>
    </div>
  </div>

  <div
    *ngIf="errorMessage"
    class="mx-6 mt-4 flex items-center gap-3 rounded-xl border border-red-100 bg-red-50/50 px-4 py-3 text-sm text-red-700 animate-in zoom-in-95"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-5 w-5 text-red-500"
      viewBox="0 0 20 20"
      fill="currentColor"
    >
      <path
        fill-rule="evenodd"
        d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
        clip-rule="evenodd"
      />
    </svg>
    <span class="font-medium">{{ errorMessage }}</span>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-left table-auto">
      <thead>
        <tr class="bg-slate-50/50">
          <th *ngFor="let col of columns" class="p-4 border-b border-slate-100">
            <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">
              {{ col.label }}
            </span>
          </th>
          <th class="p-4 border-b border-slate-100"></th>
        </tr>
      </thead>

      <tbody class="divide-y divide-slate-50">
        <tr *ngFor="let row of pagedData()" class="hover:bg-slate-50/80 transition-colors group">
          <td *ngFor="let col of columns" class="p-4">
            <ng-container *ngIf="editingId() !== row.id">
              <span class="text-sm font-medium text-slate-600">
                {{ col.type === 'date' ? (row[col.key] | date: 'dd/MM/yyyy') : row[col.key] }}
              </span>
            </ng-container>

            <input
              *ngIf="editingId() === row.id"
              class="w-full px-3 py-1.5 text-sm bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none"
              [(ngModel)]="form()[col.key]"
            />
          </td>

          <td class="p-4 text-right">
            <div class="flex items-center justify-end gap-2">
              <button
                *ngIf="editingId() !== row.id && auth.role() === 'ADMIN'"
                (click)="startEdit(row)"
                class="px-5 py-2 text-xs font-bold rounded-xl bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 transition-all cursor-pointer shadow-sm"
              >
                Edit
              </button>

              <ng-container *ngIf="editingId() === row.id">
                <button
                  class="px-4 py-2 text-xs font-bold rounded-xl bg-emerald-600 text-white hover:bg-emerald-700 transition-all cursor-pointer"
                  (click)="saveEdit(row.id)"
                >
                  Update
                </button>

                <button
                  class="h-9 w-9 inline-flex items-center justify-center rounded-xl bg-red-50 text-red-600 hover:bg-red-100 cursor-pointer transition-all"
                  (click)="onDelete(row.id)"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-4 h-4"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"
                    />
                  </svg>
                </button>

                <button
                  class="px-4 py-2 text-xs font-bold rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all cursor-pointer"
                  (click)="cancel()"
                >
                  Exit
                </button>
              </ng-container>
            </div>
          </td>
        </tr>

        <tr *ngIf="creating()" class="bg-indigo-50/30">
          <td *ngFor="let col of columns" class="p-4">
            <input
              class="w-full px-3 py-1.5 text-sm bg-white border border-indigo-200 rounded-lg focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none"
              [(ngModel)]="form()[col.key]"
            />
          </td>

          <td class="p-4">
            <div class="flex items-center justify-end gap-2">
              <button
                class="px-5 py-2 text-xs font-bold rounded-xl bg-indigo-600 text-white hover:bg-indigo-700 transition-all cursor-pointer shadow-sm"
                (click)="saveCreate()"
              >
                Save
              </button>
              <button
                class="px-5 py-2 text-xs font-bold rounded-xl bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 transition-all cursor-pointer"
                (click)="cancel()"
              >
                Cancel
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div
    *ngIf="data.length > pageSize"
    class="flex items-center justify-between px-6 py-4 border-t border-slate-50 bg-slate-50/30"
  >
    <p class="text-xs font-bold text-slate-400 tracking-widest uppercase">
      Page {{ currentPage() }} of {{ totalPages() }}
    </p>

    <div class="flex gap-2">
      <button
        class="rounded-xl border border-slate-200 bg-white py-2 px-4 text-xs font-bold text-slate-600 hover:bg-slate-50 disabled:opacity-30 disabled:cursor-not-allowed transition-all cursor-pointer"
        (click)="prevPage()"
        [disabled]="currentPage() === 1"
      >
        Previous
      </button>

      <button
        class="rounded-xl border border-slate-200 bg-white py-2 px-4 text-xs font-bold text-slate-600 hover:bg-slate-50 disabled:opacity-30 disabled:cursor-not-allowed transition-all cursor-pointer"
        (click)="nextPage()"
        [disabled]="currentPage() === totalPages()"
      >
        Next
      </button>
    </div>
  </div>
</div>
