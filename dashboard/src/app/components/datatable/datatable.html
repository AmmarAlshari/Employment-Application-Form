<div class="relative flex flex-col text-slate-700 bg-white shadow-md rounded-xl bg-clip-border">
  <!-- Header -->
  <div class="flex items-center gap-6 px-10 py-7">
    <!-- Title -->
    <h3 class="text-lg font-semibold text-slate-800 whitespace-nowrap">
      {{ title }}
    </h3>

    <!-- Search -->
    <div class="flex-1 max-w-md px-5">
      <input
        type="text"
        [placeholder]="searchTitle"
        (input)="searchTerm.set($any($event.target).value)"
        class="block w-full px-4 py-2 border border-gray-300 rounded-md leading-5 bg-white placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 sm:text-sm"
      />
    </div>

    <!-- Button -->
    <button
      class="flex items-center gap-2 rounded bg-blue-800 py-2.5 px-4 text-xs font-semibold text-white shadow-md hover:shadow-lg transition-all cursor-pointer whitespace-nowrap"
      type="button"
      (click)="startCreate()"
    >
      {{ buttonTitle }}
    </button>
  </div>

  <!-- Table -->
  <div class="p-0 overflow-x-auto">
    <table class="w-full mt-4 text-left table-auto min-w-max">
      <thead>
        <tr>
          <th *ngFor="let col of columns" class="p-4 border-y border-slate-200 bg-slate-50">
            <p class="text-sm font-normal leading-none text-slate-500">
              {{ col.label }}
            </p>
          </th>
          <th class="p-2 border-y border-slate-200 bg-slate-50">
            <div
              class="mx-1 mt-1 mb-1 flex items-start gap-3 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
              *ngIf="errorMessage"
            >
              <!-- Icon -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 mt-0.5 text-red-600"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 14h-2v-2h2v2zm0-4h-2V6h2v6z" />
              </svg>

              <!-- Message -->
              <span> {{ errorMessage }} </span>
            </div>
          </th>
        </tr>
      </thead>

      <tbody>
        <!-- Existing rows -->
        <tr *ngFor="let row of pagedData()">
          <td *ngFor="let col of columns" class="p-4 border-b border-slate-200">
            <!-- View mode -->
            <ng-container *ngIf="editingId() !== row.id">
              <span class="text-sm text-slate-500">
                {{ col.type === 'date' ? (row[col.key] | date : 'dd/MM/yyyy') : row[col.key] }}
              </span>
            </ng-container>

            <!-- Edit mode -->
            <input
              *ngIf="editingId() === row.id"
              class="w-full px-3 py-2 text-sm border rounded-md"
              [(ngModel)]="form()[col.key]"
            />
          </td>

          <!-- Actions -->
          <td class="p-4 border-b border-slate-200">
            <div class="flex items-center gap-4">
              <!-- VIEW MODE -->
              <button
                *ngIf="editingId() !== row.id"
                class="h-8 w-8 rounded-lg text-slate-700 hover:bg-slate-900/10 transition-all flex items-center justify-center"
                (click)="startEdit(row)"
                title="Edit"
              >
                <!-- Edit icon -->
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  class="w-4 h-4"
                >
                  <path
                    d="M21.731 2.269a2.625 2.625 0 00-3.712 0l-1.157 1.157 3.712 3.712 1.157-1.157a2.625 2.625 0 000-3.712zM19.513 8.199l-3.712-3.712-12.15 12.15a5.25 5.25 0 00-1.32 2.214l-.8 2.685a.75.75 0 00.933.933l2.685-.8a5.25 5.25 0 002.214-1.32L19.513 8.2z"
                  />
                </svg>
              </button>

              <!-- EDIT MODE -->
              <ng-container *ngIf="editingId() === row.id">
                <!-- Save -->
                <button
                  class="flex items-center gap-1 px-3 py-1 text-xs font-semibold rounded bg-green-700 text-white hover:bg-green-800"
                  (click)="saveEdit(row.id)"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-4 h-4"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                  >
                    <path d="M5 13l4 4L19 7" />
                  </svg>
                  <span>Update</span>
                </button>

                <!-- Cancel -->
                <button
                  class="flex items-center gap-1 px-3 py-1 text-xs font-semibold rounded bg-gray-200 hover:bg-gray-300"
                  (click)="cancel()"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-4 h-4"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    (click)="cancel()"
                  >
                    <path d="M6 18L18 6M6 6l12 12" />
                  </svg>
                  <span>Cancel</span>
                </button>

                <!-- Delete -->
                <button
                  class="flex items-center gap-1 px-3 py-1 text-xs font-semibold rounded bg-red-600 text-white hover:bg-red-700"
                  (click)="onDelete(row.id)"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-4 h-4"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                  >
                    <path
                      d="M9 3h6a1 1 0 011 1v1h4v2H4V5h4V4a1 1 0 011-1zM6 9h12l-1 11a2 2 0 01-2 2H9a2 2 0 01-2-2L6 9z"
                    />
                  </svg>
                  <span>Delete</span>
                </button>
              </ng-container>
            </div>
          </td>
        </tr>

        <!-- Create row -->
        <tr *ngIf="creating()">
          <td *ngFor="let col of columns" class="p-4 border-b border-slate-200">
            <input
              class="w-full px-3 py-2 text-sm border rounded-md"
              [(ngModel)]="form()[col.key]"
            />
          </td>

          <td class="p-4 border-b border-slate-200">
            <div class="flex items-center gap-3">
              <button
                class="px-3 py-1 text-xs font-semibold rounded bg-blue-800 text-white hover:bg-blue-900"
                (click)="saveCreate()"
              >
                Save
              </button>

              <button
                class="px-3 py-1 text-xs font-semibold rounded bg-gray-200 hover:bg-gray-300"
                (click)="cancel()"
              >
                Cancel
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <div
      *ngIf="data.length > pageSize"
      class="flex items-center justify-between px-4 py-3 border-t border-slate-200"
    >
      <p class="text-sm text-slate-500">Page {{ currentPage() }} of {{ totalPages() }}</p>

      <div class="flex gap-2">
        <button
          class="rounded border border-slate-300 py-2 px-3 text-xs font-semibold text-slate-600 hover:bg-slate-50 disabled:opacity-50"
          (click)="prevPage()"
          [disabled]="currentPage() === 1"
        >
          Previous
        </button>

        <button
          class="rounded border border-slate-300 py-2 px-3 text-xs font-semibold text-slate-600 hover:bg-slate-50 disabled:opacity-50"
          (click)="nextPage()"
          [disabled]="currentPage() === totalPages()"
        >
          Next
        </button>
      </div>
    </div>
  </div>
</div>
