<div class="flex w-full flex-col justify-center font-sans">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex justify-center">
      <div
        class="h-20 w-20 rounded-2xl bg-white shadow-sm border border-slate-100 flex items-center justify-center p-2"
      >
        <img src="assets/images/almajdouie.ico" alt="Almajdouie" class="h-14 w-14 object-contain" />
      </div>
    </div>

    <h2 class="mt-4 text-center text-3xl font-bold tracking-tight text-slate-800">Welcome Back</h2>
    <p class="mt-2 text-center text-sm text-slate-500 font-medium">
      Sign in to manage your applications
    </p>
  </div>

  <div class="mt-6 sm:mx-auto sm:w-full sm:max-w-md">
    <div
      class="bg-white py-8 px-6 shadow-xl shadow-slate-200/50 border border-slate-100 sm:rounded-3xl sm:px-10"
    >
      <form class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-bold text-slate-700"> Email address </label>
          <div class="mt-1 relative">
            <input
              id="email"
              type="email"
              [(ngModel)]="email"
              name="email"
              required
              placeholder="admin@almajdouie.com"
              class="block w-full rounded-xl border border-slate-200 bg-slate-50/50 px-4 py-3 text-slate-900 placeholder:text-slate-400 focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all sm:text-sm"
            />
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-bold text-slate-700"> Password </label>
          <div class="mt-1 relative">
            <input
              id="password"
              type="password"
              [(ngModel)]="password"
              name="password"
              required
              placeholder="••••••••"
              class="block w-full rounded-xl border border-slate-200 bg-slate-50/50 px-4 py-3 text-slate-900 placeholder:text-slate-400 focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all sm:text-sm"
            />
          </div>
        </div>

        <div class="min-h-[50px] flex items-center">
          <div *ngIf="errorMessage()" class="w-full animate-in fade-in zoom-in-95 duration-200">
            <div class="rounded-xl bg-red-50 p-3 border border-red-100">
              <div class="flex items-center">
                <svg class="h-4 w-4 text-red-400 shrink-0" viewBox="0 0 20 20" fill="currentColor">
                  <path
                    fill-rule="evenodd"
                    d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z"
                    clip-rule="evenodd"
                  />
                </svg>
                <p class="ml-2 text-xs font-medium text-red-700">{{ errorMessage() }}</p>
              </div>
            </div>
          </div>
        </div>

        <div>
          <button
            type="submit"
            (click)="login()"
            class="flex w-full justify-center rounded-xl bg-indigo-600 px-4 py-3 text-sm font-bold text-white shadow-lg shadow-indigo-100 hover:bg-indigo-700 active:scale-[0.98] transition-all focus:outline-none"
          >
            Sign in to Account
          </button>
        </div>
      </form>
      <div class="mt-6 pt-3 border-t border-slate-50 text-center">
        <p class="text-[10px] text-slate-400 font-medium">&copy; 2026 Almajdouie Admin Portal.</p>
      </div>
    </div>
  </div>
</div>
