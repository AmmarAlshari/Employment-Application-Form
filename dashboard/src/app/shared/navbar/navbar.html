<nav
  class="bg-white border-b border-gray-100 py-7 px-6 md:px-20 flex justify-end items-center top-0 z-50"
>
  <div class="flex items-center gap-4">
    <!-- ROLE BADGE -->
    <span
      *ngIf="auth.role() === 'ADMIN'"
      class="px-3 py-1 text-xs font-semibold rounded-full bg-purple-100 text-purple-800"
    >
      Admin
    </span>

    <span
      *ngIf="auth.role() === 'HR'"
      class="px-3 py-1 text-xs font-semibold rounded-full bg-blue-100 text-blue-800"
    >
      HR
    </span>

    <!-- EMAIL -->
    <span class="text-sm text-gray-600 hidden sm:block font-semibold p-3">
      {{ auth.email() }}
    </span>

    <!-- LOGO -->
    <a routerLink="/Survey/Index" class="cursor-pointer">
      <img src="assets/images/logo.png" alt="Almajdouie Logo" class="h-10 md:h-14 w-auto" />
    </a>
  </div>
</nav>
