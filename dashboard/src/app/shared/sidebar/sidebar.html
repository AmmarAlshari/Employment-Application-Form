<div class="flex min-h-screen bg-slate-50 font-sans">
  <aside
    [ngClass]="isCollapsed ? 'w-20' : 'w-72'"
    class="relative hidden sm:flex flex-col bg-white border-r border-slate-200 transition-all duration-300 ease-in-out shadow-sm"
  >
    <div class="h-24 flex items-center px-4 border-b border-slate-50">
      <div
        class="flex items-center gap-3 w-full"
        [ngClass]="isCollapsed ? 'justify-center' : 'px-2'"
      >
        <div class="min-w-[48px] h-12 flex items-center justify-center overflow-hidden">
          <img src="assets/images/almajdouie.ico" alt="Logo" class="h-10 w-10 object-contain" />
        </div>
        <span
          *ngIf="!isCollapsed"
          class="font-bold text-slate-800 text-lg tracking-tight whitespace-nowrap animate-in fade-in slide-in-from-left-2 duration-300"
        >
          Admin Panel
        </span>
      </div>
    </div>

    <div class="flex-1 flex flex-col justify-between py-6 overflow-y-auto custom-scrollbar">
      <ul class="px-4 space-y-2">
        <li>
          <button
            (click)="toggleCollapse()"
            class="flex items-center w-full p-3 rounded-xl text-slate-400 hover:bg-slate-50 hover:text-indigo-600 transition-all group"
          >
            <div class="min-w-[24px] flex justify-center">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6 transition-transform duration-300"
                [ngClass]="isCollapsed ? 'rotate-180' : ''"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M11 19l-7-7 7-7m8 14l-7-7 7-7"
                />
              </svg>
            </div>
            <span *ngIf="!isCollapsed" class="ml-3 text-sm font-bold">Minimize Menu</span>
          </button>
        </li>

        <div class="my-4 border-t border-slate-50"></div>

        <li>
          <a
            routerLink="/dashboard"
            routerLinkActive="bg-indigo-50 text-indigo-600 shadow-sm"
            class="flex items-center p-3 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-indigo-600 transition-all group"
          >
            <div class="min-w-[24px] flex justify-center">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
                />
              </svg>
            </div>
            <span *ngIf="!isCollapsed" class="ml-3 text-sm font-bold">Dashboard</span>
          </a>
        </li>

        <li>
          <a
            routerLink="/application"
            routerLinkActive="bg-indigo-50 text-indigo-600 shadow-sm"
            class="flex items-center p-3 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-indigo-600 transition-all group"
          >
            <div class="min-w-[24px] flex justify-center">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                />
              </svg>
            </div>
            <span *ngIf="!isCollapsed" class="ml-3 text-sm font-bold">Applications</span>
          </a>
        </li>

        <li *ngIf="auth.role() === 'ADMIN'">
          <a
            routerLink="/users"
            routerLinkActive="bg-indigo-50 text-indigo-600 shadow-sm"
            class="flex items-center p-3 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-indigo-600 transition-all group"
          >
            <div class="min-w-[24px] flex justify-center">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"
                />
              </svg>
            </div>
            <span *ngIf="!isCollapsed" class="ml-3 text-sm font-bold">Users</span>
          </a>
        </li>

        <li class="relative">
          <button
            (click)="toggleDataTable()"
            [ngClass]="
              dataTableOpen && !isCollapsed ? 'bg-slate-50 text-indigo-600' : 'text-slate-600'
            "
            class="flex items-center w-full p-3 rounded-xl hover:bg-slate-50 hover:text-indigo-600 transition-all group cursor-pointer"
          >
            <div class="min-w-[24px] flex justify-center">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"
                />
              </svg>
            </div>
            <span *ngIf="!isCollapsed" class="ml-3 text-sm font-bold flex-1 text-left"
              >Data Tables</span
            >
            <svg
              *ngIf="!isCollapsed"
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4 transition-transform duration-200"
              [ngClass]="dataTableOpen ? 'rotate-180' : ''"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              />
            </svg>
          </button>

          <ul
            *ngIf="dataTableOpen && !isCollapsed"
            class="mt-1 ml-9 space-y-1 animate-in slide-in-from-top-2 duration-200"
          >
            <li>
              <a
                routerLink="/datatable/cities"
                routerLinkActive="text-indigo-600 font-bold"
                class="block p-2 text-xs text-slate-500 hover:text-indigo-600 transition-colors"
                >Cities</a
              >
            </li>
            <li>
              <a
                routerLink="/datatable/nationalities"
                routerLinkActive="text-indigo-600 font-bold"
                class="block p-2 text-xs text-slate-500 hover:text-indigo-600 transition-colors"
                >Nationalities</a
              >
            </li>
            <li>
              <a
                routerLink="/datatable/roles"
                routerLinkActive="text-indigo-600 font-bold"
                class="block p-2 text-xs text-slate-500 hover:text-indigo-600 transition-colors"
                >Selected Roles</a
              >
            </li>
            <li>
              <a
                routerLink="/datatable/qualifications"
                routerLinkActive="text-indigo-600 font-bold"
                class="block p-2 text-xs text-slate-500 hover:text-indigo-600 transition-colors"
                >Qualifications</a
              >
            </li>
            <li>
              <a
                routerLink="/datatable/status"
                routerLinkActive="text-indigo-600 font-bold"
                class="block p-2 text-xs text-slate-500 hover:text-indigo-600 transition-colors"
                >Application Status</a
              >
            </li>
          </ul>
        </li>
      </ul>

      <div class="px-4 mt-auto">
        <button
          (click)="isSignOut()"
          class="flex items-center w-full p-3 rounded-xl text-red-500 hover:bg-red-50 transition-all group"
        >
          <div class="min-w-[24px] flex justify-center">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
              />
            </svg>
          </div>
          <span *ngIf="!isCollapsed" class="ml-3 text-sm font-bold">Sign Out</span>
        </button>
      </div>
    </div>
  </aside>

  <nav
    class="sm:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-8 py-4 flex justify-between items-center z-50 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]"
  >
    <a
      routerLink="/dashboard"
      routerLinkActive="text-indigo-600 scale-110"
      class="p-1 text-slate-400 transition-all"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
        />
      </svg>
    </a>
    <a
      routerLink="/application"
      routerLinkActive="text-indigo-600 scale-110"
      class="p-1 text-slate-400 transition-all"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
        />
      </svg>
    </a>
    <button (click)="isSignOut()" class="p-1 text-red-400 transition-all active:scale-90">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
        />
      </svg>
    </button>
  </nav>

  <main class="flex-1 h-screen overflow-y-auto pb-24 sm:pb-0 bg-slate-50/50">
    <ng-content></ng-content>
  </main>
</div>
