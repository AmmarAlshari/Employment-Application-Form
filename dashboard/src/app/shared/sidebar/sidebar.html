<!-- component -->
<div class="w-full h-full">
  <div class="flex flex-no-wrap">
    <div
      style="min-height: 100vh"
      [ngClass]="isCollapsed ? 'w-25' : 'w-72'"
      class="absolute sm:relative bg-blue-900 md:h-full flex-col justify-between hidden sm:flex py-45 transition-all duration-300"
    >
      <div class="px-8 flex flex-col justify-center h-full">
        <div class="text-center"></div>
        <ul>
          <li class="flex w-full justify-between text-gray-300 cursor-pointer items-center mb-10">
            <a
              href="javascript:void(0)"
              class="flex items-center focus:outline-none focus:ring-2 focus:ring-white"
              (click)="toggleCollapse()"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="icon icon-tabler icon-tabler-grid"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path stroke="none" d="M0 0h24v24H0z"></path>
                <rect x="4" y="4" width="6" height="6" rx="1"></rect>
                <rect x="14" y="4" width="6" height="6" rx="1"></rect>
                <rect x="4" y="14" width="6" height="6" rx="1"></rect>
                <rect x="14" y="14" width="6" height="6" rx="1"></rect>
              </svg>
              <span class="text-sm ml-2" *ngIf="!isCollapsed">Menu</span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="ml-auto w-10 h-5 transition-transform duration-300"
                [ngClass]="isCollapsed ? 'rotate-180' : ''"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 19l-7-7 7-7"
                />
              </svg>
            </a>
          </li>
          <li
            class="flex w-full justify-between text-gray-400 hover:text-gray-300 cursor-pointer items-center mb-6"
          >
            <a
              href="javascript:void(0)"
              class="flex items-center focus:outline-none focus:ring-2 focus:ring-white"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="icon icon-tabler icon-tabler-puzzle"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path stroke="none" d="M0 0h24v24H0z"></path>
                <path
                  d="M4 7h3a1 1 0 0 0 1 -1v-1a2 2 0 0 1 4 0v1a1 1 0 0 0 1 1h3a1 1 0 0 1 1 1v3a1 1 0 0 0 1 1h1a2 2 0 0 1 0 4h-1a1 1 0 0 0 -1 1v3a1 1 0 0 1 -1 1h-3a1 1 0 0 1 -1 -1v-1a2 2 0 0 0 -4 0v1a1 1 0 0 1 -1 1h-3a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1h1a2 2 0 0 0 0 -4h-1a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1"
                ></path>
              </svg>
              <a routerLink="/dashboard"
                ><span class="text-sm ml-2" *ngIf="!isCollapsed">Dashboard</span></a
              >
            </a>
          </li>
          <li
            class="flex w-full justify-between text-gray-400 hover:text-gray-300 cursor-pointer items-center mb-6"
          >
            <a
              routerLink="/application"
              class="flex items-center focus:outline-none focus:ring-2 focus:ring-white"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="icon icon-tabler icon-tabler-compass"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path stroke="none" d="M0 0h24v24H0z"></path>
                <polyline points="8 16 10 10 16 8 14 14 8 16"></polyline>
                <circle cx="12" cy="12" r="9"></circle>
              </svg>
              <span class="text-sm ml-2" *ngIf="!isCollapsed">Applications</span>
            </a>
          </li>
          <li
            class="flex w-full justify-between text-gray-400 hover:text-gray-300 cursor-pointer items-center mb-6"
            *ngIf="auth.role() === 'ADMIN'"
          >
            <a
              routerLink="/users"
              class="flex items-center focus:outline-none focus:ring-2 focus:ring-white"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"
                />
              </svg>

              <span class="text-sm ml-2" *ngIf="!isCollapsed">Users</span>
            </a>
          </li>
          <li class="flex flex-col w-full text-gray-400 hover:text-gray-300 cursor-pointer mb-6">
            <!-- Parent -->
            <div class="flex items-center justify-between" (click)="toggleDataTable()">
              <div class="flex items-center">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="icon icon-tabler icon-tabler-puzzle"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  fill="none"
                >
                  <path stroke="none" d="M0 0h24v24H0z"></path>
                  <path
                    d="M4 7h3a1 1 0 0 0 1 -1v-1a2 2 0 0 1 4 0v1a1 1 0 0 0 1 1h3a1 1 0 0 1 1 1v3a1 1 0 0 0 1 1h1a2 2 0 0 1 0 4h-1a1 1 0 0 0 -1 1v3a1 1 0 0 1 -1 1h-3a1 1 0 0 1 -1 -1v-1a2 2 0 0 0 -4 0v1a1 1 0 0 1 -1 1h-3a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1h1a2 2 0 0 0 0 -4h-1a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1"
                  ></path>
                </svg>

                <span class="text-sm ml-2" *ngIf="!isCollapsed"> Data table </span>
              </div>

              <span *ngIf="!isCollapsed">▾</span>
            </div>

            <!-- Sub menu -->
            <ul
              *ngIf="dataTableOpen && !isCollapsed"
              class="ml-6 mt-3 space-y-3 text-sm text-gray-400"
            >
              <li routerLink="/datatable/cities" class="hover:text-white cursor-pointer">Cities</li>
              <li routerLink="/datatable/nationalities" class="hover:text-white cursor-pointer">
                Nationalities
              </li>
              <li routerLink="/datatable/roles" class="hover:text-white cursor-pointer">
                Selected Roles
              </li>
              <li routerLink="/datatable/qualifications" class="hover:text-white cursor-pointer">
                Qualifications
              </li>
              <li routerLink="/datatable/status" class="hover:text-white cursor-pointer">
                Application Status
              </li>
            </ul>
          </li>

          <li
            class="flex w-full justify-between text-gray-400 hover:text-gray-300 cursor-pointer items-center mb-6"
          >
            <a
              href="javascript:void(0)"
              class="flex items-center focus:outline-none focus:ring-2 focus:ring-white"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="icon icon-tabler icon-tabler-stack"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path stroke="none" d="M0 0h24v24H0z" />
                <polyline points="12 4 4 8 12 12 20 8 12 4" />
                <polyline points="4 12 12 16 20 12" />
                <polyline points="4 16 12 20 20 16" />
              </svg>
              <span class="text-sm ml-2" *ngIf="!isCollapsed">Inventory</span>
            </a>
          </li>
          <li
            class="flex w-full justify-between text-gray-400 hover:text-red-300 cursor-pointer items-center mt-10"
            (click)="isSignOut()"
          >
            <a class="flex items-center focus:outline-none focus:ring-2 focus:ring-white">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="icon icon-tabler icon-tabler-stack"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75"
                />
              </svg>
              <span class="text-sm ml-2" *ngIf="!isCollapsed">Sign out</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
    <div
      class="w-64 z-40 absolute bg-gray-800 shadow md:h-full flex-col justify-between sm:hidden transition duration-150 ease-in-out"
      id="mobile-nav"
    ></div>
  </div>
</div>
